<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<p style="font-family:system-ui;padding:24px">กำลังเปิด PaperRef Finder…</p>
<script>
(() => {
  const frame = crypto.randomUUID();
  let loaded = false, loading = false, ack = 0;
  const outgoing = new Map(), pending = new Map(), cancel = new Set();
  const nativeFetch = window.fetch.bind(window);
  const send = type => window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',dataType:'json',value:{
    type,frame,nonce:crypto.randomUUID(),ack,requests:[...outgoing.values()],cancel:[...cancel]
  }}, '*');
  const height = () => {
    let h = window.screen.availHeight || 900;
    try { h = window.parent.innerHeight; } catch (_) {}
    window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:Math.max(320,h)}, '*');
  };
  height();
  try { window.parent.addEventListener('resize',height); } catch (_) { window.addEventListener('resize',height); }
  const toBase64 = bytes => {
    let text=''; for(let i=0;i<bytes.length;i+=32768)text+=String.fromCharCode(...bytes.subarray(i,i+32768));
    return btoa(text);
  };
  const fromBase64 = value => Uint8Array.from(atob(value),c=>c.charCodeAt(0));
  window.fetch = async (input,options={}) => {
    const path = typeof input==='string' ? input : input.url;
    if(!path.startsWith('/api/'))return nativeFetch(input,options);
    const id=crypto.randomUUID(), signal=options.signal;
    if(signal?.aborted)throw new DOMException('Aborted','AbortError');
    let body=null;
    if(options.body instanceof FormData){
      const entries=[];
      for(const [name,value] of options.body.entries()){
        if(value instanceof Blob){
          if(value.size>50*1024*1024)throw new Error('ไฟล์มีขนาดเกิน 50 MB');
          entries.push({name,file:true,filename:value.name||'paper.pdf',mime:value.type,data:toBase64(new Uint8Array(await value.arrayBuffer()))});
        }else entries.push({name,value});
      }
      body={kind:'form',entries};
    }else if(options.body!=null)body={kind:'text',text:String(options.body)};
    if(signal?.aborted)throw new DOMException('Aborted','AbortError');
    return new Promise((resolve,reject)=>{
      const item={resolve,reject,controller:null,signal};
      const abort=()=>{
        outgoing.delete(id);pending.delete(id);cancel.add(id);
        item.controller?.error(new DOMException('Aborted','AbortError'));
        reject(new DOMException('Aborted','AbortError'));send('control');
      };
      item.abort=abort;signal?.addEventListener('abort',abort,{once:true});
      pending.set(id,item);outgoing.set(id,{id,path,method:options.method||'GET',headers:Object.fromEntries(new Headers(options.headers).entries()),body});
      send('requests');
    });
  };
  const release=(id,item)=>{item.signal?.removeEventListener('abort',item.abort);pending.delete(id);};
  async function load(html){
    loading=true;
    const page=new DOMParser().parseFromString(html,'text/html');
    const scripts=[...page.querySelectorAll('script')].map(s=>({src:s.getAttribute('src'),text:s.textContent}));
    page.querySelectorAll('script').forEach(s=>s.remove());
    document.head.replaceChildren(...page.head.childNodes);
    // Streamlit sets scrolling="no" on component iframes. Use an explicit
    // body scroll container so mouse wheel, keyboard and touch still work.
    const scrolling=document.createElement('style');
    scrolling.textContent='html {height:100%;overflow:hidden} body {height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;scroll-padding-top:90px}';
    document.head.append(scrolling);
    document.body.replaceChildren(...page.body.childNodes);
    document.body.tabIndex=0; // Keyboard users can focus and scroll the page.
    for(const script of scripts){
      const tag=document.createElement('script');
      if(script.src){
        tag.src=script.src;
        await new Promise(resolve=>{tag.onload=tag.onerror=resolve;document.head.append(tag);});
      }else {tag.textContent=script.text;document.body.append(tag);}
    }
    loaded=true;loading=false;height();send('ready');
  }
  window.addEventListener('message',event=>{
    if(event.source!==window.parent||event.data.type!=='streamlit:render')return;
    const args=event.data.args||{};
    if(args.html&&!loaded&&!loading)load(args.html).catch(()=>{document.body.textContent='เปิดหน้าแอปไม่สำเร็จ กรุณารีเฟรช';});
    if(args.frame!==frame)return;
    let changed=false;
    for(const id of args.accepted||[])if(outgoing.delete(id))changed=true;
    for(const e of args.events||[]){
      if(e.seq<=ack)continue;ack=e.seq;changed=true;
      const item=pending.get(e.id);if(!item)continue;
      if(e.kind==='start'){
        const stream=new ReadableStream({start:controller=>item.controller=controller,cancel:()=>{cancel.add(e.id);release(e.id,item);send('control');}});
        item.resolve(new Response(stream,{status:e.status,headers:e.headers}));
      }else if(e.kind==='chunk')item.controller?.enqueue(fromBase64(e.data));
      else if(e.kind==='end'){item.controller?.close();release(e.id,item);}
      else if(e.kind==='error'){
        const error=new Error(e.detail);item.controller?.error(error);item.reject(error);release(e.id,item);
      }
    }
    if(changed)send('control');
  });
  window.parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');
  send('boot');
})();
</script></body></html>
